# Starts an Android emulator with the game on a GitHub runner and makes it usable in any browser
# for a limited time (noVNC through a temporary Cloudflare tunnel). Start it by hand:
# Actions -> "Online-Emulator" -> "Run workflow". The link appears in the run summary after ~3 minutes.
# Anyone who has the (random) link can operate the emulator while the run is active.
name: Online-Emulator

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Wie viele Minuten soll der Emulator erreichbar sein?'
        default: '30'

permissions:
  contents: read

concurrency:
  group: online-emulator
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator im Browser
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install emulator and remote-display tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify openbox imagemagick \
            libpulse0 libnss3 libxkbfile1 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxkbcommon-x11-0 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 > /dev/null
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" "system-images;android-34;default;x86_64" > /dev/null
      - name: Start the emulator and the game
        timeout-minutes: 12
        run: bash scripts/online-emulator.sh start
      - name: Publish the link
        run: bash scripts/online-emulator.sh link
      - uses: actions/upload-artifact@v4
        with:
          name: online-emulator-link
          path: online-emulator
      - name: Keep the emulator running
        env:
          MINUTES: ${{ inputs.minutes }}
        run: bash scripts/online-emulator.sh keepalive "$MINUTES"
